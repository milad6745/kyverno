name: Build Kyverno Offline Bundle

on:
  workflow_dispatch:
    inputs:
      chart_version:
        description: 'Kyverno Helm chart version (leave empty for latest stable)'
        required: false
        type: string
      platform:
        description: 'Target Linux image architecture'
        required: true
        type: choice
        default: linux/amd64
        options:
          - linux/amd64
          - linux/arm64

permissions:
  contents: read

jobs:
  bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Install Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.17.3

      - name: Install YAML parser
        run: python3 -m pip install --user 'PyYAML==6.0.2'

      - name: Download Helm chart
        env:
          CHART_VERSION: ${{ inputs.chart_version }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p bundle
          helm repo add kyverno https://kyverno.github.io/kyverno/
          helm repo update
          if [[ -n "$CHART_VERSION" ]]; then
            helm pull kyverno/kyverno --version "$CHART_VERSION" --destination bundle
          else
            helm pull kyverno/kyverno --destination bundle
          fi
          CHART_TGZ=$(find bundle -maxdepth 1 -name 'kyverno-*.tgz' -print -quit)
          test -n "$CHART_TGZ"
          helm template kyverno "$CHART_TGZ" --namespace kyverno --include-crds > bundle/install-rendered.yaml
          echo "Chart: $CHART_TGZ"

      - name: Extract unique images
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import yaml
          images = set()
          def scan(value):
              if isinstance(value, dict):
                  for key, item in value.items():
                      if key == 'image' and isinstance(item, str) and item.strip():
                          images.add(item.strip())
                      else:
                          scan(item)
              elif isinstance(value, list):
                  for item in value:
                      scan(item)
          with open('bundle/install-rendered.yaml', encoding='utf-8') as f:
              for doc in yaml.safe_load_all(f):
                  scan(doc)
          if not images:
              raise SystemExit('No images found in rendered chart')
          with open('bundle/images.txt', 'w', encoding='utf-8') as f:
              f.write('\n'.join(sorted(images)) + '\n')
          print(f'{len(images)} unique image references:')
          print('\n'.join(sorted(images)))
          PY

      - name: Pull images once and create a single TAR
        env:
          TARGET_PLATFORM: ${{ inputs.platform }}
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t images < bundle/images.txt
          for img in "${images[@]}"; do
            echo "Pulling $img ($TARGET_PLATFORM)"
            docker pull --platform "$TARGET_PLATFORM" "$img"
          done
          docker save --output bundle/images.tar "${images[@]}"
          echo "All unique images stored in bundle/images.tar"
          ls -lh bundle/

      - name: Upload ONE offline ZIP artifact
        uses: actions/upload-artifact@v4
        with:
          name: kyverno-offline-bundle
          path: bundle/
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
