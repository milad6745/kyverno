
name: Build Kyverno Offline Bundle

on:
  workflow_dispatch:
    inputs:
      chart_version:
        description: 'Kyverno Helm chart version (e.g. 3.9.0)'
        required: true
        default: '3.9.0'
      platform:
        description: 'Container image platform'
        required: true
        type: choice
        options:
          - linux/amd64
          - linux/arm64

permissions:
  contents: read

jobs:
  offline-bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout scripts
        uses: actions/checkout@v4

      - name: Install Helm
        uses: azure/setup-helm@v4.3.1
        with:
          version: v3.17.3

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install parser
        run: python -m pip install 'PyYAML==6.0.2'

      - name: Download chart, render manifests and discover all images
        env:
          CHART_VERSION: ${{ inputs.chart_version }}
        run: |
          set -euo pipefail
          mkdir -p bundle
          helm repo add kyverno https://kyverno.github.io/kyverno/
          helm repo update
          helm pull kyverno/kyverno --version "$CHART_VERSION" --destination bundle
          mv "bundle/kyverno-${CHART_VERSION}.tgz" bundle/kyverno-chart.tgz
          helm show values bundle/kyverno-chart.tgz > bundle/values.yaml
          helm template kyverno bundle/kyverno-chart.tgz \
            --namespace kyverno --include-crds > bundle/install.yaml
          python scripts/collect-images.py bundle/install.yaml bundle/images.txt
          test -s bundle/images.txt
          cat bundle/images.txt

      - name: Pull unique images and save a single TAR
        env:
          PLATFORM: ${{ inputs.platform }}
        run: |
          set -euo pipefail
          while IFS= read -r image; do
            echo "Pulling $image for $PLATFORM"
            docker pull --platform "$PLATFORM" "$image"
          done < bundle/images.txt
          mapfile -t images < bundle/images.txt
          docker save --output bundle/kyverno-images.tar "${images[@]}"
          sha256sum bundle/kyverno-images.tar > bundle/SHA256SUMS

      - name: Add offline installation tooling
        run: |
          cp scripts/install-offline.sh bundle/install-offline.sh
          cp scripts/helm-image-rewriter.py bundle/helm-image-rewriter.py
          cp scripts/collect-images.py bundle/collect-images.py
          cp README-offline.md bundle/README.md
          chmod +x bundle/install-offline.sh bundle/helm-image-rewriter.py

      - name: Create single ZIP
        run: |
          set -euo pipefail
          (cd bundle && zip -q -0 -r ../kyverno-offline-bundle.zip .)
          unzip -t kyverno-offline-bundle.zip
          ls -lh kyverno-offline-bundle.zip

      - name: Upload exactly one bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: kyverno-offline-bundle
          path: kyverno-offline-bundle.zip
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
