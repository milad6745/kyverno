
name: Build Kyverno Offline Bundle

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  KYVERNO_VERSION: v1.11.4
  OFFLINE_REGISTRY: repo.nexus.local:32082
  OFFLINE_PREFIX: kyverno

jobs:
  build-offline-bundle:
    runs-on: ubuntu-latest

    steps:
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y zip
          python3 -m pip install --user PyYAML

      - name: Download official Kyverno manifest
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p bundle

          curl -fL --retry 3 \
            "https://github.com/kyverno/kyverno/releases/download/${KYVERNO_VERSION}/install.yaml" \
            -o bundle/install.yaml

          test -s bundle/install.yaml

      - name: Extract unique images and prepare offline manifest
        shell: bash
        run: |
          set -euo pipefail

          python3 <<'PY'
          import os
          import yaml
          import hashlib
          from pathlib import Path

          bundle = Path("bundle")
          manifest = bundle / "install.yaml"

          registry = os.environ["OFFLINE_REGISTRY"].rstrip("/")
          prefix = os.environ["OFFLINE_PREFIX"].strip("/")

          with manifest.open() as f:
              documents = list(yaml.safe_load_all(f))

          images = set()

          def collect(obj):
              if isinstance(obj, dict):
                  for key, value in obj.items():
                      if key == "image" and isinstance(value, str):
                          images.add(value)
                      else:
                          collect(value)
              elif isinstance(obj, list):
                  for item in obj:
                      collect(item)

          for document in documents:
              collect(document)

          if not images:
              raise RuntimeError("No images found in manifest")

          mapping = {}

          for source in sorted(images):
              digest = hashlib.sha256(
                  source.encode()
              ).hexdigest()[:16]

              target = (
                  f"{registry}/{prefix}/"
                  f"image-{digest}:offline"
              )

              mapping[source] = target

          def replace_images(obj):
              if isinstance(obj, dict):
                  for key, value in obj.items():
                      if key == "image" and value in mapping:
                          obj[key] = mapping[value]
                      else:
                          replace_images(value)
              elif isinstance(obj, list):
                  for item in obj:
                      replace_images(item)

          for document in documents:
              replace_images(document)

          with (bundle / "install-offline.yaml").open("w") as f:
              yaml.safe_dump_all(
                  documents,
                  f,
                  sort_keys=False,
                  explicit_start=True
              )

          with (bundle / "images.txt").open("w") as f:
              for source in sorted(mapping):
                  f.write(source + "\n")

          with (bundle / "image-map.tsv").open("w") as f:
              for source, target in sorted(mapping.items()):
                  f.write(f"{source}\t{target}\n")

          print(f"Unique images: {len(mapping)}")

          for source, target in sorted(mapping.items()):
              print(f"{source} -> {target}")
          PY

      - name: Pull unique images
        shell: bash
        run: |
          set -euo pipefail

          while IFS= read -r image; do
            echo "Pulling: $image"

            docker pull \
              --platform linux/amd64 \
              "$image"

          done < bundle/images.txt

      - name: Create single image TAR
        shell: bash
        run: |
          set -euo pipefail

          mapfile -t IMAGES < bundle/images.txt

          docker save \
            -o bundle/images.tar \
            "${IMAGES[@]}"

          test -s bundle/images.tar

      - name: Create offline load and push script
        shell: bash
        run: |
          set -euo pipefail

          cat > bundle/load-and-push.sh <<'EOF'
          #!/usr/bin/env bash
          set -euo pipefail

          cd "$(dirname "$0")"

          echo "Loading offline images..."
          docker load -i images.tar

          while IFS=$'\t' read -r source target; do
            echo "Tagging $source -> $target"

            docker tag "$source" "$target"

            echo "Pushing $target"
            docker push "$target"

          done < image-map.tsv

          echo "All images pushed successfully."
          EOF

          chmod +x bundle/load-and-push.sh

      - name: Validate bundle
        shell: bash
        run: |
          set -euo pipefail

          python3 <<'PY'
          import yaml

          with open("bundle/install-offline.yaml") as f:
              docs = list(yaml.safe_load_all(f))

          assert docs, "Offline manifest is empty"

          with open("bundle/images.txt") as f:
              images = [line.strip() for line in f if line.strip()]

          assert len(images) == len(set(images)), \
              "Duplicate images found"

          print("Manifest valid")
          print("Unique images:", len(images))
          PY

      - name: Build single ZIP bundle
        shell: bash
        run: |
          set -euo pipefail

          ZIP_NAME="kyverno-offline-${KYVERNO_VERSION}.zip"

          cd bundle
          zip -q -9 "../${ZIP_NAME}" \
            install.yaml \
            install-offline.yaml \
            images.tar \
            images.txt \
            image-map.tsv \
            load-and-push.sh

          cd ..

          ls -lh "${ZIP_NAME}"

      - name: Upload ZIP artifact
        uses: actions/upload-artifact@v4
        with:
          name: kyverno-offline-bundle
          path: kyverno-offline-${{ env.KYVERNO_VERSION }}.zip
          retention-days: 7
          compression-level: 0
          if-no-files-found: error
